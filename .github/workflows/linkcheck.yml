name: Link check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      # On PRs, run --offline: resolve root-relative links locally via
      # --root-dir and skip absolute URLs, for fast deterministic feedback.
      # Pushes to main do the full check and catch external link rot.
      # Action and binary are both pinned: the floating `@v2` tag moved
      # lychee 0.23 -> 0.24, which changed protocol-relative URL resolution
      # and reddened an unrelated PR. Bump deliberately.
      - name: Check links in built site
        uses: lycheeverse/lychee-action@v2.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          lycheeVersion: v0.24.2
          args: >-
            --no-progress
            --config .github/lychee.toml
            --root-dir ${{ github.workspace }}/dist
            ${{ github.event_name == 'pull_request' && '--offline' || '' }}
            './dist/**/*.html'
          format: json
          output: ${{ github.workspace }}/lychee-report.json
          # Don't let the action itself fail the job — the next step decides.
          fail: false

      # Fail only on real errors (404, connection refused, ...). Timeouts
      # from slow third-party hosts are flaky on GitHub's runners and must
      # not block merges.
      - name: Fail on non-timeout link errors
        run: |
          report="${{ github.workspace }}/lychee-report.json"
          errors=$(jq '.errors' "$report")
          timeouts=$(jq '.timeouts' "$report")
          echo "Errors: $errors"
          echo "Timeouts (ignored): $timeouts"
          if [ "$errors" -gt 0 ]; then
            echo "::error::lychee reported $errors broken link(s)"
            jq -r '.error_map | to_entries[] | "\n### \(.key)\n" + (.value | map("- [\(.status.code // .status.text)] \(.url)") | join("\n"))' "$report"
            exit 1
          fi
