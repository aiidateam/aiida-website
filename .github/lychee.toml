# Publisher/DOI hosts (Wiley, ACS, Nature, doi.org, ...) frequently return
# 403/429 to anonymous bots even though the URLs resolve in a real browser,
# so we treat those statuses as successes in addition to the usual 2xx range.
accept = "200..=299,403,429"

max_retries = 2
# Generous: archive.org replays snapshots slower than a live host answers.
timeout = 60
# Some DOI / publisher redirect chains (Springer, Nature) hop through more
# than the default 5 redirects before landing on the final page.
max_redirects = 15

# Only hosts that work in a browser but not from a GitHub runner. Dead links
# get repointed at a web.archive.org snapshot or demoted to plain text in the
# page, never parked here. Symptoms last verified 2026-07-22.
exclude = [
  # Incomplete certificate chain (reachable with `curl -k`).
  "^https?://events\\.prace-ri\\.eu/",

  # Expired certificate.
  "^https?://dome40\\.eu/",

  # WAF rejects GitHub runner IPs; answers 200 from an ordinary network.
  "^https?://(www\\.)?prace-ri\\.eu/",

  # Slower than the timeout from GitHub's runners.
  "^https?://indico\\.ictp\\.it/",
  "^https?://juser\\.fz-juelich\\.de/",

  # Loops through an idp.nature.com cookie bounce for non-browser clients.
  "^https?://www\\.nature\\.com/sdata/publish/",

  # TODO: unverified. The 2019 survey PDF timed out from two networks outside
  # CI, so a dead object is indistinguishable from local egress filtering.
  # Better fix: self-host it under /survey/ like the 2020 and 2024 results.
  "^https?://object\\.cscs\\.ch/",
]
